<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Acompanhe suas demandas pelo celular, mesmo offline.">
  <meta name="theme-color" content="#f5f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121814" media="(prefers-color-scheme: dark)">
  <title>Demandas</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>
    // Aplica o tema escolhido antes de desenhar a página, para não piscar a cor errada.
    try {
      const tema = localStorage.getItem('demandas.tema');
      if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
    } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1>Demandas</h1>
      <button type="button" id="botao-tema" class="botao-tema"></button>
    </div>
    <div class="conta" id="conta"></div>
    <dl class="resumo">
      <div class="resumo-item">
        <dt>Para fazer</dt>
        <dd id="total-fazer">0</dd>
      </div>
      <div class="resumo-item">
        <dt>Aguardando</dt>
        <dd id="total-aguardando">0</dd>
      </div>
      <div class="resumo-item">
        <dt>Concluídas</dt>
        <dd id="total-concluidas">0</dd>
      </div>
    </dl>
  </header>

  <nav class="abas" role="tablist" aria-label="Abas">
    <button class="aba" role="tab" id="aba-projetos" aria-selected="true" data-aba="projetos">Projetos</button>
    <button class="aba" role="tab" id="aba-pessoal" aria-selected="false" data-aba="pessoal">Pessoal</button>
  </nav>

  <main class="conteudo">
    <form class="rapido" id="form-rapido" autocomplete="off">
      <label class="oculto" for="campo-rapido">Nova tarefa</label>
      <input id="campo-rapido" type="text" placeholder="Anotar tarefa nova…" enterkeyhint="done">
      <button type="submit">Adicionar</button>
    </form>

    <div class="controles">
      <label class="controle-ordem">Ordem
        <select id="ordem">
          <option value="manual">Minha ordem</option>
          <option value="prazo">Prazo (mais perto)</option>
          <option value="alfabetica">A–Z</option>
          <option value="recentes">Mais recentes</option>
          <option value="antigas">Mais antigas</option>
        </select>
      </label>
      <label class="controle-agrupar">
        <input type="checkbox" id="agrupar" checked> Agrupar
      </label>
    </div>

    <section id="lista" class="lista"></section>

    <footer class="backup">
      <h2>Backup</h2>
      <p>Exporte uma cópia de vez em quando para não perder nada.</p>
      <div class="backup-acoes">
        <button type="button" id="botao-exportar">Exportar JSON</button>
        <button type="button" id="botao-importar">Importar JSON</button>
      </div>
      <button type="button" id="botao-desfazer" class="desfazer" hidden></button>
      <!-- Sem "accept": no Android esse filtro costuma bloquear arquivos .json válidos.
           O conteúdo é conferido pelo app na importação. -->
      <input type="file" id="arquivo-importar" hidden>
    </footer>
  </main>

  <div id="aviso-atualizacao" class="aviso-atualizacao" role="status" hidden>
    <span>Nova versão disponível.</span>
    <button type="button" id="botao-atualizar">Atualizar</button>
  </div>

  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo">
    <form id="form-editar" class="form-editar">
      <h2 id="dialogo-titulo">Editar tarefa</h2>

      <label>Título
        <input name="titulo" required>
      </label>

      <label>Descrição
        <textarea name="desc" rows="3"></textarea>
      </label>

      <div class="linha">
        <label>Aba
          <select name="aba">
            <option value="projetos">Projetos</option>
            <option value="pessoal">Pessoal</option>
          </select>
        </label>
        <label>Grupo
          <input name="grupo" list="lista-grupos" required>
        </label>
      </div>
      <datalist id="lista-grupos"></datalist>

      <div class="linha">
        <label>Tag
          <select name="tag">
            <option value="next">Próximo</option>
            <option value="wait">Aguardando</option>
            <option value="decide">Decidir</option>
            <option value="someday">Algum dia</option>
          </select>
        </label>
        <label>Texto da tag
          <input name="tagTexto" placeholder="Opcional">
        </label>
      </div>

      <label>Prazo
        <input name="prazo" type="date">
      </label>

      <div class="dialogo-acoes">
        <button type="button" id="botao-excluir" class="perigo">Excluir</button>
        <button type="button" id="botao-cancelar">Cancelar</button>
        <button type="submit" class="principal">Salvar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
